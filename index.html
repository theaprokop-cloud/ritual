<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rituál — skincare deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.__URL_TYPE=(location.hash.match(/type=([a-z_]+)/)||[])[1]||"";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#FFFFFF;--paper:#F7F6F2;--ink:#111111;--ink2:#3E3B38;--muted:#7D7973;--line:#E6E4DF;--chip:#ECEBE6;--accent:#7A1F2B;--accent-soft:#F3ECE8;--good:#2F6B47;--warn:#9A5F0E;--bad:#A3261B;--serif:'EB Garamond',Garamond,Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 104px)}
header.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 6px}
.brand{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1}
.toplinks{display:flex;gap:18px;font-size:14px}
.toplinks button{background:none;border:0;padding:0}
.masthead{text-align:center;margin:26px 0 30px}
.kicker{font-size:14px;font-weight:600;letter-spacing:0;color:var(--ink)}
h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.08;margin:8px 0 0;letter-spacing:-.01em}
h1 em,h2 em,h3 em,.hero em{font-style:italic}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px;line-height:1.1}
h3{font-family:var(--serif);font-size:25px;font-weight:400;margin:0 0 14px;letter-spacing:-.005em}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:11.5px}
.section{margin:0 0 38px}
.card{background:var(--paper);border:0;border-radius:0;padding:18px}
.card+.card{margin-top:12px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #CFCCC6;background:#fff;color:var(--ink);border-radius:999px;padding:11px 28px;font-size:15px;font-weight:400}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 18px;font-size:14px}
.btn[disabled]{opacity:.45}
.btn.danger{color:var(--bad);border-color:#E3C2BE}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:9px 16px;font-size:14px;line-height:1}
.chip.on{border-color:var(--ink);background:#E3E2DC}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:10px 0;font-size:14px}
.seg button.on{border-color:var(--ink);background:#E3E2DC}
.row{display:flex;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .title{font-family:var(--serif);font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{flex:none;width:28px;height:28px;border:1.2px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:transparent;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.chk.done{background:var(--ink)}.chk.done svg{opacity:1}
.row.isdone .title{text-decoration:line-through;color:var(--muted)}
.num{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);width:16px;flex:none;text-align:center}
.thumb{flex:none;width:56px;height:68px;background:var(--paper);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;margin:5px 4px 0 0;color:var(--ink2);background:var(--chip)}
.tag.act{background:var(--accent-soft);color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.status .dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700;flex:none}
.st-bad{color:var(--bad)}.st-bad .dot{background:var(--bad)}
.st-warn{color:var(--warn)}.st-warn .dot{background:var(--warn)}
.st-good{color:var(--good)}.st-good .dot{background:var(--good)}
.alert{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border-bottom:0}
.alert .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;margin-top:1px}
.alert.bad .ic{background:var(--bad)}.alert.warn .ic{background:var(--warn)}.alert.info .ic{background:var(--ink2)}.alert.good .ic{background:var(--good)}
.alert b{font-weight:600}
.uv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uv>div{padding:18px;background:var(--paper)}
.uv .big{font-family:var(--serif);font-size:60px;line-height:.9}
.uv .lab{font-size:13px;color:var(--muted);margin-top:8px}
.uv .spf{font-size:14px;margin-top:4px}
.uv .spf b{font-weight:600}
.guide{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.guide span{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--muted)}
.guide span.on{background:var(--ink);color:#fff}
.empty{text-align:center;padding:30px 10px;color:var(--muted);background:var(--paper)}
.empty .serif{font-family:var(--serif);font-size:24px;color:var(--ink);margin-bottom:6px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:18px 0 7px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:0;padding:11px 12px;color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=search]{background:var(--chip);border:0;border-radius:999px;padding:11px 18px}
textarea{min-height:84px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .inner{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;font-size:12px;color:var(--muted);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:5px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--ink);font-weight:600}
.fab{position:fixed;right:max(22px,calc(50% - 258px));bottom:calc(env(safe-area-inset-bottom) + 82px);width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.16);z-index:19}
.fab svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(17,17,17,.35)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:18px 22px calc(env(safe-area-inset-bottom) + 28px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;position:sticky;top:-18px;background:#fff;padding:6px 0 10px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);border:0;padding:18px;margin-bottom:10px;position:relative}
.choice .t{font-family:var(--serif);font-size:20px}.choice .d{font-size:13px;color:var(--muted)}
.choice input[type=file]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.choice svg{width:26px;height:26px;flex:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.cond{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cond button{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:12px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cond button .f{font-family:var(--serif);font-size:22px;line-height:1}
.cond button.on{border-color:var(--ink);background:#E3E2DC}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid #CFCCC6;background:#fff;font-size:18px}
.stepper .v{font-family:var(--serif);font-size:32px;min-width:80px;text-align:center}
.selfie{position:relative;overflow:hidden;background:var(--paper)}
.selfie img{width:100%;display:block;max-height:420px;object-fit:cover}
.ai{background:var(--paper);padding:20px}
.ai .k{font-size:14px;font-weight:600;margin-bottom:10px}
.ai p:first-of-type{font-family:var(--serif);font-size:20px;line-height:1.3}
.ai .kicker{margin-top:12px}
.ai ul{margin:6px 0 12px;padding-left:18px}.ai li{margin-bottom:5px}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.score .n{font-family:var(--serif);font-size:28px}
.score .b{height:4px;background:#E3E1DB;border-radius:2px;overflow:hidden;margin-top:4px}
.score .b i{display:block;height:100%;background:var(--ink);border-radius:2px}
.bars .bar{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:10px;margin:10px 0;font-size:13.5px}
.bars .track{height:22px;background:#fff;border-radius:11px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);opacity:.85;border-radius:11px;min-width:4px}
.bars .pct{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats>div{padding:16px 12px;background:var(--paper);text-align:center}
.stats .n{font-family:var(--serif);font-size:34px;line-height:1}
.stats .l{font-size:12px;color:var(--muted);margin-top:6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{border:0;padding:0;background:none;position:relative;aspect-ratio:3/4;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);font-size:11px;padding:2px 7px;border-radius:999px;color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.banner{font-size:12.5px;padding:10px 14px;background:var(--paper);color:var(--ink2);margin-bottom:20px;border-radius:999px;text-align:center}
.hero{font-family:var(--serif);font-size:30px;line-height:1.12;margin:0 0 6px}
.daylist .row{cursor:pointer}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.loading .serif{font-family:var(--serif);font-size:44px;color:var(--ink)}
.pill-active{font-size:12px;margin-top:4px}
.issue{padding:2px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .when{font-size:12px;color:var(--muted);margin-top:4px}
.center{text-align:center}
#ob{position:fixed;inset:0;background:#fff;z-index:70;overflow:auto;-webkit-overflow-scrolling:touch}
#ob .in{max-width:520px;min-height:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column}
#ob .top{display:flex;justify-content:space-between;align-items:center}
#ob .body{flex:1;padding:28px 0 20px}
#ob .welcome{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 0}
#ob .welcome h1{font-size:54px;line-height:1.02;margin:0 0 22px}
#ob .welcome .lead{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink2);max-width:360px;margin:0 auto 30px}
#ob .feat{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:8px}
#ob .feat span{font-size:13px;color:var(--muted)}
#ob .foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet{z-index:90}.toast{z-index:95}
#auth{position:fixed;inset:0;background:#fff;z-index:80;overflow:auto}
#auth .in{max-width:440px;min-height:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column}
#auth .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
#auth input{margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:0 -22px}
.ptile{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:0;text-align:left;position:relative;display:flex;flex-direction:column}
.ptile .im{aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;background:#fff}
.ptile .im img{width:100%;height:100%;object-fit:contain}
.ptile .im .ph{font-family:var(--serif);font-style:italic;font-size:34px;color:#C9C5BE}
.ptile .cap{border-top:1px solid var(--line);padding:8px 10px 10px}
.ptile .br{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .nm{font-family:var(--serif);font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .flag{position:absolute;top:8px;left:8px;font-size:10px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.ptile .flag.bad{color:var(--bad);border-color:#E3C2BE}.ptile .flag.warn{color:var(--warn);border-color:#E8D5B5}
.photo-big{background:#fff;border:1px solid var(--line);aspect-ratio:4/5;max-width:240px;margin:0 auto 10px;display:grid;place-items:center;overflow:hidden}
.photo-big img{width:100%;height:100%;object-fit:contain}
.unverified{font-size:12px;color:var(--warn);background:#FBF3E6;padding:8px 12px;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">rituál</div>
    <div class="toplinks"><button data-act="goto" data-tab="produkty">produkty</button><button data-act="goto" data-tab="profil">profil</button></div>
  </header>
  <div class="masthead"><div class="kicker" id="hdrKicker"></div><h1 id="hdrTitle">rituál</h1></div>
  <main id="view"><div class="loading"><div><div class="serif">rituál</div><div class="small">Načítám tvoji rutinu…</div></div></div></main>
</div>
<button class="fab hidden" id="fab" data-act="addProduct" aria-label="Přidat produkt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="inner">
  <button data-act="goto" data-tab="dnes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Dnes</button>
  <button data-act="goto" data-tab="produkty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="7" width="8" height="14" rx="1.5"/><path d="M10 7V4h4v3M8 12h8"/></svg>Produkty</button>
  <button data-act="goto" data-tab="plet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3c4.4 0 7 3.4 7 8 0 5-3.4 10-7 10s-7-5-7-10c0-4.6 2.6-8 7-8z"/><path d="M9.5 14.5c1.4 1 3.6 1 5 0"/><circle cx="9.5" cy="10.5" r=".6" fill="currentColor"/><circle cx="14.5" cy="10.5" r=".6" fill="currentColor"/></svg>Deník</button>
  <button data-act="goto" data-tab="prehled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Přehled</button>
</div></nav>
<div class="sheet hidden" id="sheet"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-panel"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn" data-act="closeSheet" aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetBody"></div></div></div>
<div id="auth" class="hidden"></div>
<div id="ob" class="hidden"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const wdIdx=s=>(parseYmd(s).getDay()+6)%7;
const WD=['Po','Út','St','Čt','Pá','So','Ne'];
const fmtLong=s=>parseYmd(s).toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parseYmd(s).toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'});
const fmtMed=s=>parseYmd(s).toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const nf=(n,d=1)=>Number(n).toLocaleString('cs-CZ',{maximumFractionDigits:d,minimumFractionDigits:0});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

function cycleOn(){return S.profile.gender==='zena'&&S.profile.cycleOn!==false;}
function periodStarts(){const ev=new Set(S.profile.periodStarts||[]);if(S.profile.lastPeriod)ev.add(S.profile.lastPeriod);Object.keys(S.days).forEach(d=>{if(S.days[d]&&S.days[d].period)ev.add(d);});const list=[...ev].sort();const st=[];let last=null;for(const d of list){if(last===null||diffDays(d,last)>3)st.push(d);last=d;}return st;}
function cycleLength(){const st=periodStarts();const gaps=[];for(let i=1;i<st.length;i++){const g=diffDays(st[i],st[i-1]);if(g>=20&&g<=45)gaps.push(g);}const g=gaps.slice(-6);if(g.length)return{L:Math.round(g.reduce((a,b)=>a+b,0)/g.length),learned:true,n:g.length};return{L:Math.max(20,Math.min(45,+S.profile.cycleLen||28)),learned:false,n:0};}
function cycleInfo(date){if(!cycleOn())return null;const {L,learned}=cycleLength();const P=Math.max(2,Math.min(10,+S.profile.periodLen||5));const st=periodStarts().filter(x=>x<=date);if(!st.length)return null;const start=st[st.length-1];const day=diffDays(date,start)+1;const late=Math.max(0,day-L);
  if(late>21)return{day,phase:null,late,L,learned,lost:true};
  const ov=L-14;let ph;if(day<=P)ph='menstruace';else if(day<ov-1)ph='folikularni';else if(day<=ov+1)ph='ovulace';else if(day>L-6||late)ph='pozdni';else ph='lutealni';
  return{day,phase:ph,next:L-day+1,late,L,learned,start};}

const allActive=()=>Object.values(S.products).filter(p=>!p.archived);

function washDates(){return Object.keys(S.days).filter(d=>dayWashed(d)).sort();}

function washInterval(){const w=washDates().slice(-7);const g=[];for(let i=1;i<w.length;i++){const x=diffDays(w[i],w[i-1]);if(x>0&&x<=14)g.push(x);}if(g.length>=2)return{v:g.reduce((a,b)=>a+b,0)/g.length,learned:true};return{v:(WASHF[S.profile.washFreq]||[0,3])[1],learned:false};}
function washInfo(date){const w=washDates().filter(d=>d<date);const last=w[w.length-1]||null;const iv=washInterval();const since=last?diffDays(date,last):null;const due=since===null||since>=Math.round(iv.v);return{last,since,iv,due,today:dayWashed(date),next:last?Math.max(0,Math.round(iv.v)-since):0};}
function inciItems(text){return String(text||'').toLowerCase().replace(/\([^)]*\)/g,m=>' '+m.slice(1,-1)+' ').split(/[,;•\n]|\.\s/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);}

function detectActives(text){const items=inciItems(text);const out=[];for(const[k,v]of Object.entries(ACTIVES)){if(inciHas(items,v))out.push(k);}return out;}
function actOf(p){const s=new Set(p.actives||[]);if(p.category==='spf')s.add('spf');return s;}
function isScheduled(p,date,slot){
  if(p.archived||!p[slot])return false;
  const f=p.freq||{type:'daily'};
  if(f.type==='asneeded')return false;
  if(f.type==='days')return(f.days||[]).includes(wdIdx(date));
  if(f.type==='interval'){const n=Math.max(1,+f.every||1);const d=diffDays(date,f.start||date);return d>=0&&d%n===0;}
  return true;
}

function slotText(p){return[p.am?'Ráno':'',p.pm?'Večer':'',p.any?'Kdykoli':''].filter(Boolean).join(' + ')||'Nenaplánováno';}

const extraDue=(p,date)=>{if(!p.any)return false;const f=p.freq||{type:'daily'};if(f.type==='asneeded')return false;const q=Object.assign({},p,{any:false,am:true});return isScheduled(q,date,'am');};

function expiryStatus(p){const e=expiryOf(p);if(!e)return null;const d=diffDays(e,todayStr());if(d<0)return{lvl:'bad',text:'Po expiraci',d,e};if(d<=30)return{lvl:'warn',text:'Expiruje za '+d+' '+(d===1?'den':d<5?'dny':'dní'),d,e};return{lvl:'good',text:'Do '+fmtShort(e),d,e};}

const trName=x=>(TREAT[x.type]||TREAT.jine)[0]+(x.type==='jine'&&x.custom?': '+x.custom:'');
function analyzeSlot(prods,slot){
  const issues=[];const has=k=>prods.filter(p=>actOf(p).has(k));
  const any=ks=>prods.filter(p=>ks.some(k=>actOf(p).has(k)));
  const add=(id,lvl,ps,title,text)=>{if(ps.length)issues.push({id,lvl,pids:[...new Set(ps.map(p=>p.id))].sort(),title,text,slot});};
  const ret=has('retinoid'),ex=any(EXFOL),vc=has('vitc'),bp=has('bpo'),cu=has('copper');
  if(ret.length&&ex.length&&!(ret.length===1&&ex.length===1&&ret[0]===ex[0]))add('ret-ex','bad',[...ret,...ex],'Retinoid + exfoliační kyseliny','Ve stejné rutině zvyšují riziko podráždění a narušení bariéry. Střídej večery, třeba kyseliny 2× týdně a retinoid v ostatní dny.');
  if(ret.length&&bp.length)add('ret-bpo','bad',[...ret,...bp],'Retinoid + benzoyl peroxid','Benzoyl peroxid může oxidovat retinol a tretinoin (adapalen je stabilní). Dej BPO ráno a retinoid večer.');
  if(ret.length&&vc.length)add('ret-c','warn',[...ret,...vc],'Retinoid + vitamin C','Ve stejné fázi zbytečně dráždí. Osvědčené rozdělení: vitamin C ráno, retinoid večer.');
  if(vc.length&&bp.length)add('c-bpo','warn',[...vc,...bp],'Vitamin C + benzoyl peroxid','Benzoyl peroxid oxiduje vitamin C, takže ten ztrácí účinek.');
  if(vc.length&&ex.length)add('c-ex','warn',[...vc,...ex],'Vitamin C + AHA/BHA','Kombinace kyselin může citlivou pleť pálit. Pokud cítíš štípání, rozděl je.');
  if(cu.length&&(vc.length||ex.length))add('cu','warn',[...cu,...vc,...ex],'Měďnaté peptidy + kyseliny / vitamin C','Nízké pH a vitamin C oslabují měďnaté peptidy. Použij je v jiné části dne.');
  const exTypes=new Set();ex.forEach(p=>EXFOL.forEach(k=>actOf(p).has(k)&&exTypes.add(k)));
  if(ex.length>=2)add('multi-ex','warn',ex,'Víc exfoliantů najednou','Několik exfoliačních produktů v jedné rutině = riziko přeexfoliace. Stačí jeden.');
  if(ret.length>=2)add('multi-ret','warn',ret,'Dva retinoidy v jedné rutině','Zbytečně dráždí, účinek se nesčítá. Ponech jeden.');
  if(slot==='am'&&ret.length)add('ret-am','warn',ret,'Retinoid ráno','Retinoidy patří do večerní rutiny. Na světle se rozkládají a zvyšují citlivost na slunce.');
  if(slot==='pm'){const sp=prods.filter(p=>p.category==='spf');if(sp.length)add('spf-pm','info',sp,'SPF ve večerní rutině','Večer opalovací krém nepotřebuješ. Zvaž ho přesunout do ranní rutiny.');}
  if((S.profile.sens==='vysoka')){const fr=has('fragrance');if(fr.length)add('frag','info',fr,'Parfemace a citlivá pleť','Parfemace patří k nejčastějším dráždidlům citlivé pleti.');}
  return issues;
}
const WHEN={mraz:'Mráz / zima',teplo:'Teplo / slunce',sucha:'Suchá pleť',podrazdena:'Podrážděná pleť',mastna:'Mastná pleť',makeup:'Pod make-up'};
const normStep=v=>String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const stepName=(p,slot)=>String((slot==='am'?p.stepAm:p.stepPm)||'').trim();
const stepKey=(p,slot)=>normStep(stepName(p,slot));
const hasStep=p=>!!(stepName(p,'am')||stepName(p,'pm'));
function routineItems(date,slot){const list=scheduledFor(date,slot);const out=[];const groups={};
  list.forEach(p=>{const k=stepKey(p,slot);if(!k){out.push({p});return;}if(!groups[k]){groups[k]={step:stepName(p,slot),alts:[]};out.push({g:groups[k]});}groups[k].alts.push(p);});
  Object.entries(groups).forEach(([k,g])=>{activeProducts().filter(p=>p[slot]&&stepKey(p,slot)===k&&!g.alts.includes(p)&&!isExtra(p)).forEach(p=>g.alts.push(p));});
  return out.map(it=>it.g&&it.g.alts.length===1?{p:it.g.alts[0]}:it);}
function whenContext(date){const d=S.days[date]||{};const c={};const cs=d.concerns||[],env=d.env||[];
  if(cs.includes('suchost'))c.sucha=2;if(cs.includes('zarudnuti')||cs.includes('citlivost')||(d.condition&&d.condition<=2))c.podrazdena=2;if(cs.includes('mastnota')||cs.includes('akne'))c.mastna=2;
  if(env.includes('mraz'))c.mraz=2;if(env.includes('makeup'))c.makeup=2;if(env.includes('slunce'))c.teplo=2;
  const m=parseYmd(date).getMonth()+1;if([11,12,1,2].includes(m))c.mraz=(c.mraz||0)+0.5;if([6,7,8].includes(m))c.teplo=(c.teplo||0)+0.5;
  if(date===todayStr()){try{if(uvToday().peak>=5)c.teplo=(c.teplo||0)+1;}catch(e){}}return c;}
function usedCount(pid,days){let n=0;const t=todayStr();for(let i=0;i<days;i++){const x=S.days[addDays(t,-i)];if(x&&((x.am||{})[pid]||(x.pm||{})[pid]))n++;}return n;}
function suggestAlt(alts,date){const c=whenContext(date);let best=null,bs=0;alts.forEach(p=>{const sc=(p.when||[]).reduce((a,k)=>a+(c[k]||0),0);if(sc>bs){bs=sc;best=p;}});
  if(best)return{p:best,why:(best.when||[]).filter(k=>c[k]).map(k=>WHEN[k]).join(', ')};
  return{p:alts.slice().sort((a,b)=>usedCount(b.id,30)-usedCount(a.id,30))[0],why:''};}

/* ============ UV ============ */
function cosZenith(date,lat,lon){const r=Math.PI/180;const n=date.getTime()/864e5+2440587.5-2451545.0;const L=(280.46+0.9856474*n)%360;const g=((357.528+0.9856003*n)%360)*r;const lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*r;const eps=(23.439-0.0000004*n)*r;const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));const dec=Math.asin(Math.sin(eps)*Math.sin(lam));const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;const ha=(gmst*15+lon)*r-ra;return Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos(ha);}
function loc(){const p=S.profile;if(p.city==='vlastni'&&isFinite(+p.lat)&&isFinite(+p.lon)&&p.lat!==''&&p.lon!=='')return{name:p.cityName||'Vlastní poloha',lat:+p.lat,lon:+p.lon};const c=CITIES[p.city||'praha']||CITIES.praha;return{name:c[0],lat:c[1],lon:c[2]};}
function uvAt(date,l,f){const c=cosZenith(date,l.lat,l.lon);return c<=0?0:12.5*Math.pow(c,2.42)*f;}
function uvToday(){const t=todayStr();const L0=loc();if(uvLive&&uvLive.date===t&&uvLive.lat===L0.lat&&uvLive.lon===L0.lon){const hs=uvLive.hours;const base=parseYmd(t);let peak=0,pi=0,from=null,to=null;hs.forEach((u,i)=>{if(u>peak){peak=u;pi=i;}if(u>=3){if(from===null)from=i;to=i;}});const hh=new Date().getHours();const mk=i=>i===null?null:new Date(base.getTime()+i*36e5);return{cur:hs[hh]||0,peak,pt:mk(pi),from:mk(from),to:mk(to===null?null:to+1),l:L0,live:true};}const day=S.days[t]||{};const cf=1;const l=loc();const now=new Date();const cur=uvAt(now,l,cf);const base=parseYmd(t);let peak=0,pt=null,from=null,to=null;for(let m=0;m<1440;m+=10){const d=new Date(base.getTime()+m*6e4);const u=uvAt(d,l,cf);if(u>peak){peak=u;pt=d;}if(u>=3){if(!from)from=d;to=d;}}return{cur,peak,pt,from,to,l,cloud:day.cloud||'clear',snow:!!day.snow};}
function spfFor(u){if(u<3)return{spf:'30',t:'Nízké UV. SPF 30 ráno stačí, chrání i před UVA, které projde mraky i oknem.'};if(u<6)return{spf:'30–50',t:'Střední UV. Nanes SPF a venku ho obnovuj každé 2 hodiny.'};if(u<8)return{spf:'50',t:'Vysoké UV. SPF 50, sluneční brýle, klobouk a kolem poledne stín.'};return{spf:'50+',t:'Velmi vysoké UV. SPF 50+, mezi 11. a 15. hodinou zůstaň ve stínu.'};}
const hm=d=>d?pad(d.getHours())+':'+pad(d.getMinutes()):'';

/* ============ images & AI ============ */
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>res({img,url});img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Obrázek se nepodařilo načíst.'));};img.src=url;});}
function scaled(img,max){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;}
function cropped(img,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const r=Math.max(w/img.naturalWidth,h/img.naturalHeight);const sw=w/r,sh=h/r;c.getContext('2d').drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,0,0,w,h);return c;}
function studioPhoto(img,bbox,whiten,mode){
  const W=img.naturalWidth,H=img.naturalHeight;let x0=0,y0=0,x1=W,y1=H;
  if(mode!=='orig'&&Array.isArray(bbox)&&bbox.length===4&&bbox.every(v=>isFinite(+v))){let[a,b,c,d]=bbox.map(Number);if(c>a&&d>b&&c<=1.01&&d<=1.01){const px=(c-a)*.06,py=(d-b)*.06;x0=Math.max(0,(a-px))*W;y0=Math.max(0,(b-py))*H;x1=Math.min(1,(c+px))*W;y1=Math.min(1,(d+py))*H;}}
  const cw=x1-x0,ch=y1-y0;const sc=Math.min(1,700/Math.max(cw,ch));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(cw*sc));c.height=Math.max(1,Math.round(ch*sc));const ctx=c.getContext('2d');ctx.drawImage(img,x0,y0,cw,ch,0,0,c.width,c.height);
  let ok=false;if(whiten&&mode!=='orig'&&mode!=='crop')ok=whitenBg(c);if(whiten&&!mode&&!ok)return null;
  const out=document.createElement('canvas');out.width=400;out.height=500;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,400,500);const m=mode==='orig'?12:34;const s2=Math.min((400-2*m)/c.width,(500-2*m)/c.height);const w=c.width*s2,h=c.height*s2;o.imageSmoothingQuality='high';o.drawImage(c,(400-w)/2,(500-h)/2,w,h);
  return out.toDataURL('image/jpeg',.8);
}
function whitenBg(c){
  const ctx=c.getContext('2d');const W=c.width,H=c.height;const id=ctx.getImageData(0,0,W,H);const d=id.data;
  const border=[];for(let x=0;x<W;x+=2){border.push((x)*4,((H-1)*W+x)*4);}for(let y=0;y<H;y+=2){border.push((y*W)*4,(y*W+W-1)*4);}
  const ch=k=>border.map(i=>d[i+k]).sort((a,b)=>a-b)[border.length>>1];const br=ch(0),bg=ch(1),bb=ch(2);
  const dist=i=>Math.abs(d[i]-br)+Math.abs(d[i+1]-bg)+Math.abs(d[i+2]-bb);
  const uniform=border.filter(i=>dist(i)<60).length/border.length;if(uniform<.6)return false;
  const TOL=70;const mark=new Uint8Array(W*H);const st=[];
  for(let x=0;x<W;x++){st.push(x,(H-1)*W+x);}for(let y=0;y<H;y++){st.push(y*W,y*W+W-1);}
  while(st.length){const p=st.pop();if(mark[p])continue;const i=p*4;if(dist(i)>TOL)continue;mark[p]=1;const x=p%W,y=(p/W)|0;if(x>0)st.push(p-1);if(x<W-1)st.push(p+1);if(y>0)st.push(p-W);if(y<H-1)st.push(p+W);}
  {let tot=0,mk=0;for(let y=Math.floor(H*.25);y<H*.75;y+=2)for(let x=Math.floor(W*.3);x<W*.7;x+=2){tot++;if(mark[y*W+x])mk++;}if(tot&&mk/tot>.18)return false;}
  for(let p=0;p<W*H;p++){const i=p*4;if(mark[p]){d[i]=d[i+1]=d[i+2]=255;}else{const x=p%W,y=(p/W)|0;const nb=(x>0&&mark[p-1])+(x<W-1&&mark[p+1])+(y>0&&mark[p-W])+(y<H-1&&mark[p+W]);if(nb){const t=.35*nb/4+.25;d[i]+=(255-d[i])*t;d[i+1]+=(255-d[i+1])*t;d[i+2]+=(255-d[i+2])*t;}}}
  ctx.putImageData(id,0,0);return true;
}
function setVariants(T,img,bbox){const white=studioPhoto(img,bbox,true);const crop=studioPhoto(img,bbox,false,'crop');const orig=studioPhoto(img,null,false,'orig');T._var={white,crop,orig};T._mode=white?'white':'crop';T.photo=T._var[T._mode];}
function dataUrlToBlob(u){const [h,b]=String(u).split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
const toBlob=(c,q=.85)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function parseLoose(t){if(t&&typeof t==='object')return t;const m=String(t||'').match(/\{[\s\S]*\}/);if(!m)throw new Error('AI vrátila nečitelnou odpověď.');return JSON.parse(m[0]);}
function blobToB64(b){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.onerror=j;fr.readAsDataURL(b);});}
async function askJSON(prompt,images){const imgs=[];for(const b of images||[])imgs.push({media_type:b.type||'image/jpeg',data:await blobToB64(b)});
  try{const j=await api('/api/ai',{method:'POST',body:JSON.stringify({prompt,images:imgs})});return parseLoose(j.text);}
  catch(e){if(e.status===429)throw new Error(e.message||'Dnešní limit AI je vyčerpaný.');throw e;}}
async function decodeBarcode(file){
  const {img,url}=await loadImg(file);
  try{
    if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});const r=await det.detect(img);if(r&&r[0])return r[0].rawValue;}catch(e){}}
    try{await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');if(window.ZXing){const reader=new ZXing.BrowserMultiFormatReader();const c=scaled(img,1600);const r=await reader.decodeFromImageUrl(c.toDataURL('image/jpeg',.92));if(r)return r.getText();}}catch(e){}
    if(sampleFn&&canImages){const b=await toBlob(scaled(img,1400));const v=await askJSON('Na fotce je čárový kód (EAN) kosmetického produktu. Přečti číslice pod čárovým kódem. Odpověz pouze JSON: {"ean":"číslice, nebo prázdný řetězec když nejsou čitelné"}',[b]);if(v&&v.ean)return String(v.ean).replace(/\D/g,'')||null;}
    return null;

}

function recsFor(date){
  const d=S.days[date];if(!d||!d.condition)return[];const out=[];const cs=d.concerns||[];
  const pmStrong=scheduledFor(date,'pm').filter(p=>[...actOf(p)].some(k=>STRONG.includes(k)));
  if((d.condition<=2||cs.includes('zarudnuti')||cs.includes('citlivost'))&&pmStrong.length)out.push('Pleť je podrážděná. Dnes večer zvaž vynechání: '+pmStrong.map(p=>p.name).join(', ')+'. Sázej na zklidnění a obnovu bariéry.');
  if(cs.includes('suchost'))out.push('Suchá pleť: kyselinu hyaluronovou nanášej na vlhkou pleť a zamkni ji bohatším krémem.');
  if((d.env||[]).includes('topeni'))out.push('Topení vysušuje. Pomůže zvlhčovač vzduchu a výživnější noční krém.');
  if((d.env||[]).includes('mraz'))out.push('Mráz a vítr: přidej ochranný krém nebo balzám na tváře a rty.');
  if(d.sleep&&d.sleep<6)out.push('Málo spánku se ráno projeví otoky a matností. Pomůže studený obklad a oční krém.');
  if(cs.includes('akne'))out.push('Na pupínky nesahej. Lokálně pomůže BHA nebo benzoyl peroxid, jen ne ve stejné fázi jako retinoid.');
  {const ci=cycleInfo(date);if(ci&&ci.phase&&(ci.phase==='pozdni'||ci.phase==='menstruace'))out.push(PHASES[ci.phase].l+': '+PHASES[ci.phase].t);}
  if((d.food||[]).includes('alkohol'))out.push('Po alkoholu je pleť dehydratovaná. Dnes hodně vody a hydratační maska.');
  return out;
}

}
function trendSvg(dates){
  const W=340,H=150,L=28,R=8,T=10,B=24;const n=dates.length;const x=i=>L+(n<=1?0:i*(W-L-R)/(n-1));const y=v=>T+(5-v)*(H-T-B)/4;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Stav pleti v čase">';
  [1,2,3,4,5].forEach(v=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#ECE7E0" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(v)+3.5)+'" font-size="9" text-anchor="end" fill="#857F78">'+v+'</text>';});
  let seg=[];const segs=[];dates.forEach((d,i)=>{const c=S.days[d]&&S.days[d].condition;if(c)seg.push([x(i),y(c),d,c]);else if(seg.length){segs.push(seg);seg=[];}});if(seg.length)segs.push(seg);
  segs.forEach(sg=>{if(sg.length>1)s+='<polyline fill="none" stroke="#8E2F23" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+sg.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';});
  segs.flat().forEach(p=>{s+='<g><circle cx="'+p[0]+'" cy="'+p[1]+'" r="12" fill="transparent"><title>'+fmtShort(p[2])+': '+CONDNAME[p[3]]+'</title></circle><circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#8E2F23" stroke="#fff" stroke-width="2" pointer-events="none"/></g>';});
  const ticks=n<=7?dates.map((d,i)=>i):[0,Math.floor((n-1)/2),n-1];ticks.forEach(i=>{s+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="9" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'" fill="#857F78">'+fmtShort(dates[i])+'</text>';});
  return s+'</svg><p class="tiny muted" style="margin:6px 0 0">5 = skvělá, 1 = hrozná</p>';
}
function factorInsights(logged){
  const fs=[];const avg=a=>a.reduce((s,x)=>s+x.condition,0)/a.length;
  const test=(label,pred)=>{const w=logged.filter(pred),wo=logged.filter(x=>!pred(x));if(w.length>=3&&wo.length>=3){const diff=avg(w)-avg(wo);if(Math.abs(diff)>=0.4)fs.push({diff,text:label+': pleť v průměru o '+nf(Math.abs(diff))+' bodu '+(diff>0?'lepší':'horší')+' (dní: '+w.length+').'});}};
  test('Spánek 7 h a víc',x=>x.sleep!=null&&x.sleep>=7);
  test('Vysoký stres',x=>x.stress>=4);
  Object.entries(FOOD).forEach(([k,l])=>test(l,x=>(x.food||[]).includes(k)));
  Object.entries(ACTIV).forEach(([k,l])=>test(l,x=>(x.activity||[]).includes(k)));
  Object.entries(ENV).forEach(([k,l])=>test(l,x=>(x.env||[]).includes(k)));
  return fs.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,6);
}

      if(isNew&&x.repeat&&+x.repeat>0){const nd=addDays(x.date,Math.round(+x.repeat*7));if(nd>t&&!trList().some(y=>y.type===x.type&&y.date===nd)){saveTreatment({id:uid(),type:x.type,custom:x.custom,date:nd,place:x.place,pause:x.pause,repeat:x.repeat});toast('Uloženo i s dalším termínem '+fmtShort(nd));}else toast('Uloženo');}else toast('Uloženo');
      T=null;closeSheet();render();break;}
    case'delTr':{if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Opravdu smazat?';break;}removeTreatment(T.id);T=null;closeSheet();render();toast('Smazáno');break;}
    case'pAllerg':{const s2=new Set(S.profile.allergies||[]);const v=el.dataset.v;s2.has(v)?s2.delete(v):s2.add(v);S.profile.allergies=[...s2];saveProfile();render();break;}
    case'fAllAct':{readForm();showAllAct=!showAllAct;const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;break;}
    case'fStepPick':{readForm();if(el.dataset.slot==='pm')F.stepPm=el.dataset.v;else F.stepAm=el.dataset.v;const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;break;}
    case'stepAdd':case'stepRemove':{readForm();const y=S.products[el.dataset.id];const sl=el.dataset.slot;if(!y||!F)break;const cur=sl==='am'?F.stepAm:F.stepPm;if(!cur)break;const k=sl==='am'?'stepAm':'stepPm';y[k]=a==='stepAdd'?cur:'';saveProduct(y);
      if(!F._new&&S.products[F.id]){const me=S.products[F.id];if(me[k]!==cur){me[k]=cur;saveProduct(me);}}
      const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;toast(a==='stepAdd'?'Přidáno do kroku '+cur:'Odebráno z kroku');break;}
    case'fWhen':{readForm();const s2=new Set(F.when||[]);const k=el.dataset.k;s2.has(k)?s2.delete(k):s2.add(k);F.when=[...s2];el.classList.toggle('on',s2.has(k));break;}
    case'fHw':{readForm();F.hw=el.dataset.v;const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;break;}
    case'fArea':{readForm();const v=el.dataset.v;if((v==='hair')!==isHair(F)){F.area=v;if(v==='hair'){F.category='sampon';F.hw='wash';F.am=false;F.pm=false;F.any=false;}else{F.category='serum';F.pm=true;}}const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;break;}
    case'prodFilter':prodFilter=el.dataset.v;render();break;
    case'fToggle':readForm();F[el.dataset.k]=!F[el.dataset.k];if(['any','am','pm'].includes(el.dataset.k)){const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;}else{el.classList.toggle('on',F[el.dataset.k]);previewWarn();}break;
    case'fFreq':readForm();F.freq.type=el.dataset.v;if(F.freq.type==='days'&&!(F.freq.days||[]).length)F.freq.days=[0,2,4];{const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;}break;
    case'fDay':{readForm();const i=+el.dataset.i;const ds=new Set(F.freq.days||[]);ds.has(i)?ds.delete(i):ds.add(i);F.freq.days=[...ds];el.classList.toggle('on',ds.has(i));previewWarn();break;}
    case'fAct':{readForm();const k=el.dataset.k;const s=new Set(F.actives||[]);s.has(k)?s.delete(k):s.add(k);F.actives=[...s];el.classList.toggle('on',s.has(k));previewWarn();break;}
    case'fDetect':{readForm();const found=detectActives(F.ingredients);F.actives=[...new Set([...(F.actives||[]),...found])];const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;toast(found.length?'Nalezeno: '+found.map(k=>ACTIVES[k].l).join(', '):'Ve složení jsem nic nenašla');break;}
    case'saveForm':{readForm();if(!F.name){toast('Doplň název produktu');$('#fName').focus();break;}if(!isHair(F)&&!F.am&&!F.pm&&!F.any){toast('Vyber ráno, večer nebo kdykoli');break;}if(F.freq.type==='days'&&!(F.freq.days||[]).length){toast('Vyber aspoň jeden den');break;}if(!F.actives.length&&F.ingredients)F.actives=detectActives(F.ingredients);const p=clone(F);delete p._new;delete p._var;delete p._mode;if(p._wish){S.profile.wishlist=(S.profile.wishlist||[]).filter(w=>w.id!==p._wish);delete p._wish;saveProfile();}const isNew=F._new;saveProduct(p);closeSheet();render();toast(isNew?'Přidáno do rutiny':'Uloženo');break;}
    case'archiveForm':{readForm();const p=clone(F);delete p._new;delete p._var;delete p._mode;p.archived=!p.archived;saveProduct(p);closeSheet();render();toast(p.archived?'Archivováno':'Vráceno do rutiny');break;}
    case'deleteForm':{if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Opravdu smazat?';break;}removeProduct(F.id);closeSheet();render();toast('Smazáno');break;}
    case'aiRoutine':runAiRoutine(el);break;
    case'skinPrev':skinDate=addDays(skinDate,-1);render();break;
    case'skinNext':if(skinDate<t){skinDate=addDays(skinDate,1);render();}break;
    case'cond':{const d=getDay(skinDate);d.condition=+el.dataset.v;saveDay(skinDate);render();break;}
    case'jTag':{const d=getDay(skinDate);const f=el.dataset.f,v=el.dataset.v;const s=new Set(d[f]||[]);s.has(v)?s.delete(v):s.add(v);d[f]=[...s];el.classList.toggle('on',s.has(v));saveDay(skinDate);break;}
    case'sleep':{const d=getDay(skinDate);d.sleep=Math.max(0,Math.min(14,(d.sleep??7)+(d.sleep==null?0:+el.dataset.v)));saveDay(skinDate);el.parentElement.querySelector('.v').textContent=nf(d.sleep)+' h';break;}
    case'stress':{const d=getDay(skinDate);const v=+el.dataset.v;d.stress=d.stress===v?null:v;saveDay(skinDate);render();break;}
    case'delSelfie':{const d=getDay(skinDate);delete d.selfie;saveDay(skinDate,true);render();break;}
    case'aiSkin':runAiSkin(el);break;
    case'range':range=+el.dataset.v;render();break;
    case'photo':{const d=el.dataset.d;const x=S.days[d];openSheet(fmtLong(d),'<div class="selfie"><img alt="" src="'+esc(x.selfie)+'" style="max-height:none"></div><p class="small" style="margin-top:12px">'+esc((x.condition?CONDNAME[x.condition]:'')+((x.concerns||[]).length?' · '+x.concerns.map(c=>CONCERNS[c]).join(', '):''))+'</p>'+(x.ai&&x.ai.souhrn?'<p class="small muted">'+esc(x.ai.souhrn)+'</p>':''));break;}
    case'openDay':skinDate=el.dataset.d;goto('plet');break;
    case'pSet':S.profile[el.dataset.f]=el.dataset.v;saveProfile();render();break;
    case'pConcern':{const s=new Set(S.profile.concerns||[]);const v=el.dataset.v;s.has(v)?s.delete(v):s.add(v);S.profile.concerns=[...s];saveProfile();el.classList.toggle('on',s.has(v));break;}
    case'export':{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Záloha zkopírována');}catch(e){toast('Kopírování se nepovedlo');}break;}
  }
});
const pTimers={};
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.dataset.input==='prodQuery'){prodQuery=el.value;const pos=el.selectionStart;render();const n=document.querySelector('[data-input=prodQuery]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  if(F&&el.id==='fIng'){clearTimeout(pTimers.ing);pTimers.ing=setTimeout(()=>{readForm();previewWarn();},500);return;}
  if(el.dataset.input==='meds'||el.dataset.input==='notes'){const d=getDay(skinDate);d[el.dataset.input]=el.value;saveDay(skinDate);return;}
  if(el.dataset.word!==undefined){const w=(S.profile.words||[]).slice(0,3);while(w.length<3)w.push('');w[+el.dataset.word]=el.value.trim();S.profile.words=w;clearTimeout(pTimers.w);pTimers.w=setTimeout(saveProfile,700);return;}
  if(el.dataset.pinput){const f=el.dataset.pinput;S.profile[f]=el.value;clearTimeout(pTimers[f]);pTimers[f]=setTimeout(saveProfile,700);return;}
});
document.addEventListener('change',async ev=>{const el=ev.target;
  if(el.dataset.word!==undefined){saveProfile();render();return;}
  if(el.dataset.pinput==='allergyText'){saveProfile();render();return;}
  if(el.dataset.change==='routineDate'){routineDate=el.value&&el.value<todayStr()?el.value:null;render();return;}
  if(el.dataset.change==='pStartDate'&&el.value){addPeriodStart(el.value);render();toast('Zaznamenáno: '+fmtShort(el.value));return;}
  if(el.dataset.pchange==='city'){S.profile.city=el.value;saveProfile();uvLive=null;fetchUV();render();return;}
  if(el.dataset.change==='scanFile'&&el.files[0]){onScan(el.files[0]);el.value='';return;}
  if(el.dataset.change==='lShot'){const t=$('#lShotT');if(t)t.textContent=el.files.length?('Screenshot přidán'+(el.files.length>1?' ('+el.files.length+')':'')+' ✓'):'Přidat screenshot';return;}
  if(el.dataset.change==='photoOnly'&&el.files[0]&&F){readForm();const st=$('#formStatus');if(st)st.innerHTML='<span class="spinner"></span> Upravuji fotku…';try{const{img,url}=await loadImg(el.files[0]);let bbox=null;if(sampleFn&&canImages){try{const v=await askJSON('Na obrázku je kosmetický produkt (fotka obalu nebo screenshot e-shopu). Vrať ohraničení samotného produktu jako zlomky šířky a výšky 0–1 a přečti značku a název produktu. Odpověz POUZE JSON: {"bbox":[x0,y0,x1,y1],"brand":"značka nebo prázdný řetězec","name":"název z obalu nebo prázdný řetězec"}',[await toBlob(scaled(img,1200))]);bbox=v.bbox;if(!F.brand&&v.brand){F.brand=String(v.brand);toast('Doplněna značka: '+F.brand);}if(!F.name&&v.name)F.name=String(v.name);}catch(e){}}setVariants(F,img,bbox);URL.revokeObjectURL(url);const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;}catch(e){if(st)st.textContent=e.message;}el.value='';return;}
  if(el.dataset.change==='photoFiles'&&el.files.length){if(document.getElementById('fName'))readForm();onPhotos(el.files);return;}
  if(el.dataset.change==='selfie'&&el.files[0]){try{const{img,url}=await loadImg(el.files[0]);const c=scaled(img,560);URL.revokeObjectURL(url);const d=getDay(skinDate);d.selfie=c.toDataURL('image/jpeg',.72);saveDay(skinDate,true);render();toast('Selfie uložené');}catch(e){toast(e.message);}return;}
  if(F&&(el.id==='fStepAm'||el.id==='fStepPm')){readForm();const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;return;}
  if(T&&el.id==='tType'){readTr();const sc=$('.sheet-panel').scrollTop;openTreatment(T,T._new);$('.sheet-panel').scrollTop=sc;return;}
  if(F&&el.id==='fCat'&&isHair(F)){readForm();F.hw=HWDEF[F.category]||F.hw||'wash';const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;return;}
  if(F&&['fCat'].includes(el.id)){readForm();if(F.category==='spf'){F.am=true;}if(['maska','pristroj','peeling'].includes(F.category)&&!F.any){F.any=true;F.am=false;F.pm=false;if(F.freq.type==='daily')F.freq.type='asneeded';const sc=$('.sheet-panel').scrollTop;openForm(F._new);$('.sheet-panel').scrollTop=sc;return;}previewWarn();}
});
init();
</script>
